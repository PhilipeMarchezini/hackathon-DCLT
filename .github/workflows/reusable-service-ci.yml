name: Reusable service CI/CD

on:
  workflow_call:
    inputs:
      service_name: { required: true, type: string }
      service_dir: { required: true, type: string }
      language: { required: true, type: string }
    secrets:
      AWS_ACCESS_KEY_ID: { required: false }
      AWS_SECRET_ACCESS_KEY: { required: false }
      AWS_SESSION_TOKEN: { required: false }

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: inputs.language == 'python'
        with: { python-version: '3.12', cache: pip, cache-dependency-path: '${{ inputs.service_dir }}/requirements*.txt' }
      - name: Lint, test and audit Python
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir }}
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pip-audit bandit
          ruff check app.py test_app.py
          pytest -q
          bandit -q -r app.py
          pip-audit -r requirements.txt

      - uses: actions/setup-go@v5
        if: inputs.language == 'go'
        with: { go-version: '1.25.7', cache-dependency-path: '${{ inputs.service_dir }}/go.sum' }
      - name: Lint, test and audit Go
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_dir }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -cover ./...
          go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4
          gosec -quiet ./...

      - name: Build image
        run: docker build --tag local/${{ inputs.service_name }}:${{ github.sha }} ./${{ inputs.service_dir }}
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ inputs.service_name }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  publish-and-update-gitops:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    concurrency:
      group: gitops-production-update
      cancel-in-progress: false
    env:
      AWS_CREDENTIALS_CONFIGURED: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SESSION_TOKEN != '' }}
    steps:
      - name: AWS Academy publication is pending credentials
        if: env.AWS_CREDENTIALS_CONFIGURED != 'true'
        run: echo "::notice::Tests, build and scan passed. ECR publication was skipped because the temporary AWS Academy secrets are not configured."
      - uses: actions/checkout@v4
        if: env.AWS_CREDENTIALS_CONFIGURED == 'true'
        with: { fetch-depth: 0 }
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_CREDENTIALS_CONFIGURED == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - id: ecr
        if: env.AWS_CREDENTIALS_CONFIGURED == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish immutable image
        if: env.AWS_CREDENTIALS_CONFIGURED == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SERVICE: ${{ inputs.service_name }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/solidarytech/$SERVICE:$TAG"
          docker build --tag "$IMAGE" ./${{ inputs.service_dir }}
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Update desired state
        if: env.AWS_CREDENTIALS_CONFIGURED == 'true'
        env: { SERVICE: '${{ inputs.service_name }}' }
        run: |
          FILE="gitops/apps/$SERVICE.yaml"
          sed -i -E "s#(image: ).*/solidarytech/$SERVICE:[^[:space:]]+#\1$IMAGE#" "$FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FILE"
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): deploy $SERVICE ${IMAGE##*:}"
          git pull --rebase origin main
          git push origin HEAD:main
