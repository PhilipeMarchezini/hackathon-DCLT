name: Infrastructure validation
on:
  pull_request: { paths: ['terraform/**', 'gitops/**', 'docker-compose.yml', '.github/workflows/infrastructure.yml'] }
  push: { branches: [main], paths: ['terraform/**', 'gitops/**', 'docker-compose.yml'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.10.5' }
      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Validate local composition
        run: docker compose config --quiet
      - name: Render Kubernetes manifests
        run: kubectl kustomize gitops/apps >/dev/null
