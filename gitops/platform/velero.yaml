apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 10.1.3
    helm:
      values: |
        # O hook upgrade-crds do chart roda docker.io/bitnamilegacy/kubectl:1.35,
        # que não existe mais desde que a Bitnami retirou as tags públicas, e o
        # Job ficava em ImagePullBackOff travando a sincronização. O hook só
        # importa em upgrade de CRDs; numa instalação nova o Helm aplica os CRDs
        # do diretório crds/ diretamente.
        upgradeCRDs: false
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.12.2
            volumeMounts: [{ mountPath: /target, name: plugins }]
        credentials: { useSecret: false }
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: solidarytech-production-velero-713071293995
              config: { region: us-west-2 }
          volumeSnapshotLocation: []
        schedules:
          solidarytech-six-hour:
            disabled: false
            schedule: "0 */6 * * *"
            template:
              includedNamespaces: [solidarytech, observability]
              ttl: 720h
              storageLocation: default
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
  destination: { server: https://kubernetes.default.svc, namespace: velero }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
