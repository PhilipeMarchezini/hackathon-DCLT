apiVersion: v1
kind: Service
metadata: { name: otel-collector, labels: { app: otel-collector } }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: prometheus, port: 8889, targetPort: 8889 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 20 }
      batch: { timeout: 5s }
      resource:
        attributes:
          - { key: deployment.environment.name, value: production, action: upsert }
          - { key: k8s.cluster.name, value: solidarytech-production-eks, action: upsert }
    exporters:
      prometheus: { endpoint: 0.0.0.0:8889 }
      otlphttp/newrelic:
        endpoint: https://otlp.nr-data.net
        headers: { api-key: "${env:NEW_RELIC_LICENSE_KEY}" }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/newrelic] }
        metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheus, otlphttp/newrelic] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          args: ["--config=/conf/config.yaml"]
          env:
            - { name: NEW_RELIC_LICENSE_KEY, valueFrom: { secretKeyRef: { name: newrelic-license, key: license-key } } }
          ports: [{ containerPort: 4317 }, { containerPort: 4318 }, { containerPort: 8889 }]
          volumeMounts: [{ name: config, mountPath: /conf }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes: [{ name: config, configMap: { name: otel-collector-config } }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: otel-collector, labels: { release: kube-prometheus-stack } }
spec: { selector: { matchLabels: { app: otel-collector } }, endpoints: [{ port: prometheus, interval: 30s }] }
