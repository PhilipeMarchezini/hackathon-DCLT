apiVersion: v1
kind: ConfigMap
metadata: { name: otel-logs-config }
data:
  config.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/observability_otel-logs*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: regex_parser
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/pods/(?P<k8s_namespace_name>[^_]+)_(?P<k8s_pod_name>[^_]+)_[^/]+/(?P<k8s_container_name>[^/]+)/.*$'
    processors:
      memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 20 }
      batch: { timeout: 5s }
      # O regex_parser do filelog grava nos atributos do log record, enquanto o
      # processor resource lê de atributos de resource. Com from_attribute o
      # service.name nunca era preenchido e todo log chegava ao Loki como
      # unknown_service, deixando o painel de logs do dashboard SRE vazio.
      # Este transform promove os campos extraídos do caminho do arquivo para o
      # resource, que é onde o exportador OTLP os transforma em labels.
      transform/promover_atributos:
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s_namespace_name"]) where attributes["k8s_namespace_name"] != nil
              - set(resource.attributes["k8s.pod.name"], attributes["k8s_pod_name"]) where attributes["k8s_pod_name"] != nil
              - set(resource.attributes["k8s.container.name"], attributes["k8s_container_name"]) where attributes["k8s_container_name"] != nil
              - set(resource.attributes["service.name"], attributes["k8s_container_name"]) where attributes["k8s_container_name"] != nil
      resource:
        attributes:
          - { key: deployment.environment.name, value: production, action: upsert }
          - { key: k8s.cluster.name, value: solidarytech-production-eks, action: upsert }
    exporters:
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
        tls: { insecure: true }
      otlphttp/newrelic:
        endpoint: https://otlp.nr-data.net
        headers: { api-key: "${env:NEW_RELIC_LICENSE_KEY}" }
    service:
      pipelines:
        logs: { receivers: [filelog], processors: [memory_limiter, transform/promover_atributos, resource, batch], exporters: [otlphttp/loki, otlphttp/newrelic] }
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: otel-logs }
spec:
  selector: { matchLabels: { app: otel-logs } }
  template:
    metadata: { labels: { app: otel-logs } }
    spec:
      serviceAccountName: otel-logs
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.136.0
          args: ["--config=/conf/config.yaml"]
          env:
            - { name: NEW_RELIC_LICENSE_KEY, valueFrom: { secretKeyRef: { name: newrelic-license, key: license-key } } }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: podlogs, mountPath: /var/log/pods, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
      volumes:
        - { name: config, configMap: { name: otel-logs-config } }
        - { name: podlogs, hostPath: { path: /var/log/pods } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-logs }
